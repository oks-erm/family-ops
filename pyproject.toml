[project]
name = "family-copilot"
version = "0.1.0"
description = "Telegram-first household and routine assistant"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13.1,<4.0.0",
    "alembic>=1.13.3,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "cryptography>=43.0.0,<47.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "greenlet>=3.1.1,<4.0.0",
    "httpx>=0.27.2,<1.0.0",
    "icalendar>=7.2.0,<8.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "pydantic-settings>=2.5.2,<3.0.0",
    "recurring-ical-events>=3.8.2,<4.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "uvicorn[standard]>=0.30.6,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
