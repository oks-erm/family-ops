# Legacy scheduling service definition. Family Copilot deploys do not load this file.
# Use explicitly with the existing infrastructure; never run down or --remove-orphans.
services:
  tutor-scheduling:
    image: ${GHCR_SCHEDULING_IMAGE}:${SCHEDULING_IMAGE_TAG:-latest}
    env_file:
      - .env.scheduling
    environment:
      PUBLIC_BASE_URL: https://${SCHEDULING_DOMAIN:-lessons.sdfgh.space}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.sdfgh.space}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scheduling.rule=Host(`${SCHEDULING_DOMAIN:-lessons.sdfgh.space}`)"
      - "traefik.http.routers.scheduling.entrypoints=websecure"
      - "traefik.http.routers.scheduling.tls.certresolver=letsencrypt"
      - "traefik.http.services.tutor-scheduling.loadbalancer.server.port=8001"
      - "traefik.http.routers.scheduling.service=tutor-scheduling"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
