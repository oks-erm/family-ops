x-household-runtime: &household-runtime
  image: ${GHCR_IMAGE}:${IMAGE_TAG:-latest}
  env_file: [.env]
  environment: &household-settings
    ASSISTANT_V2_ENABLED: "true"
    ASSISTANT_MODEL: "gpt-6-luna"
    ASSISTANT_REASONING_MODEL: "gpt-6.1-sol"
  depends_on:
    app:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 30s

services:
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped

  app:
    image: ${GHCR_IMAGE}:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      <<: *household-settings
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.sdfgh.space}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ingress:
    <<: *household-runtime
    command: ["python", "-m", "app.runtime", "ingress"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime", "ingress", "--health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  worker:
    <<: *household-runtime
    command: ["python", "-m", "app.runtime", "worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime", "worker", "--health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  delivery:
    <<: *household-runtime
    command: ["python", "-m", "app.runtime", "delivery"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime", "delivery", "--health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  scheduler:
    <<: *household-runtime
    command: ["python", "-m", "app.runtime", "scheduler"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.runtime", "scheduler", "--health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-family}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  letsencrypt:
