name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Build & push Docker image to GHCR ────────────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}
      image_name: ${{ steps.lower.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Lowercase image name
        id: lower
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.lower.outputs.name }}:sha-${{ steps.sha.outputs.short }}
            ${{ steps.lower.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Hetzner ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          script: |
            set -e
            mkdir -p /opt/family-copilot

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          source: "docker-compose.prod.yml"
          target: "/opt/family-copilot"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: ${{ needs.build-push.outputs.image_name }}
          IMAGE_TAG: "sha-${{ needs.build-push.outputs.image_tag }}"
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          envs: ENV_FILE,GHCR_TOKEN,GITHUB_ACTOR,IMAGE_NAME,IMAGE_TAG
          script: |
            set -e
            cd /opt/family-copilot

            if ! docker info >/dev/null 2>&1; then
              echo "Docker is not available for this SSH user. Use root as HETZNER_SSH_USER or add this user to the docker group."
              exit 1
            fi

            # Write production .env from secret, then pin the image tag
            printf '%s' "$ENV_FILE" > .env
            # Remove deploy-controlled image values, then append the current build image.
            sed -i '/^GHCR_IMAGE=/d' .env
            sed -i '/^IMAGE_TAG=/d' .env
            echo "GHCR_IMAGE=$IMAGE_NAME" >> .env
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env

            # Authenticate to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull new image and restart (migrations run inside the entrypoint)
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up dangling images
            docker image prune -f
