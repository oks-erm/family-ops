name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      restart_traefik:
        description: Restart Traefik to retry certificate provisioning
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: family_copilot_test
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family -d family_copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://family:family@localhost:5432/family_copilot_test
      DASHBOARD_SESSION_SECRET: ci-only-session-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile and import application
        run: |
          python -m compileall -q app alembic tests
          python -c "from app.main import app; assert app.title == 'Family Copilot'"

  # ── Build & push Docker image to GHCR ────────────────────────────────────────
  build-push:
    name: Build & push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}
      image_name: ${{ steps.lower.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Lowercase image name
        id: lower
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.lower.outputs.name }}:sha-${{ steps.sha.outputs.short }}
            ${{ steps.lower.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Hetzner ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          script: |
            set -e
            mkdir -p /opt/family-copilot

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          source: "docker-compose.prod.yml"
          target: "/opt/family-copilot"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_NAME: ${{ needs.build-push.outputs.image_name }}
          IMAGE_TAG: "sha-${{ needs.build-push.outputs.image_tag }}"
          RESTART_TRAEFIK: ${{ github.event_name == 'workflow_dispatch' && inputs.restart_traefik || false }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          envs: ENV_FILE,GHCR_TOKEN,GITHUB_ACTOR,IMAGE_NAME,IMAGE_TAG,RESTART_TRAEFIK
          script: |
            set -e
            cd /opt/family-copilot

            compose_cmd="docker compose -f docker-compose.prod.yml"

            if ! docker info >/dev/null 2>&1; then
              echo "Docker is not available for this SSH user. Use root as HETZNER_SSH_USER or add this user to the docker group."
              exit 1
            fi

            # Write production .env from secret, then pin the image tag
            # Always terminate the secret payload before appending deploy-controlled values.
            printf '%s\n' "$ENV_FILE" > .env
            # Remove deploy-controlled image values, then append the current build image.
            sed -i '/^GHCR_IMAGE=/d' .env
            sed -i '/^IMAGE_TAG=/d' .env
            echo "GHCR_IMAGE=$IMAGE_NAME" >> .env
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env

            # Authenticate to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull new image and restart (migrations run inside the entrypoint).
            # Retry once because compose can occasionally race on rapid consecutive deploys.
            $compose_cmd pull app
            if ! $compose_cmd up -d --remove-orphans; then
              echo "First compose up failed, retrying once in 5s..."
              sleep 5
              $compose_cmd up -d --remove-orphans
            fi

            if [ "$RESTART_TRAEFIK" = "true" ]; then
              echo "Restarting Traefik to retry certificate provisioning."
              $compose_cmd restart traefik
              sleep 5
              $compose_cmd logs --since=2m --tail=100 traefik
            fi

            # Verify app is running the expected image tag.
            expected_image="$IMAGE_NAME:$IMAGE_TAG"
            container_id="$($compose_cmd ps -q app)"
            if [ -z "$container_id" ]; then
              echo "App container not found after deploy."
              exit 1
            fi
            running_image="$(docker inspect "$container_id" --format '{{.Config.Image}}')"
            if [ "$running_image" != "$expected_image" ]; then
              echo "Expected running image $expected_image but found $running_image"
              exit 1
            fi

            # Wait for the API to become ready, then verify the live container and schema.
            health_ok=false
            for attempt in $(seq 1 20); do
              if $compose_cmd exec -T app python -c "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert response.status == 200; assert json.load(response) == {'status': 'ok'}"; then
                health_ok=true
                break
              fi
              sleep 2
            done
            if [ "$health_ok" != "true" ]; then
              echo "Application health check failed."
              $compose_cmd logs --tail=100 app
              exit 1
            fi

            $compose_cmd exec -T app alembic current
            $compose_cmd logs --tail=100 app

            # Clean up dangling images
            docker image prune -f
